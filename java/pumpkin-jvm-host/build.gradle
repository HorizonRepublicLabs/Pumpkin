subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
        // authlib and a few other Mojang libraries are published here and nowhere else.
        maven { url = 'https://libraries.minecraft.net' }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test { useJUnitPlatform() }
}

// The libraries Minecraft itself is built against. The generated shim reproduces real
// vanilla signatures, and those signatures name these types -- `Codec<ItemStack>`,
// `ImmutableList<Block>`, `Vector3f`. They are compileOnly on purpose: no generated body
// ever runs (every one throws), so nothing here is needed at runtime, and the JVM host
// keeps booting on the shim/fml/host jars alone. Reproducing the real signature is not
// cosmetic -- a mod's call site links against the descriptor it was compiled with.
ext.gameLibraries = [
        'com.mojang:datafixerupper:8.0.16',
        'com.mojang:brigadier:1.3.10',
        'com.mojang:authlib:6.0.57',
        'com.google.code.gson:gson:2.11.0',
        'com.google.guava:guava:33.3.1-jre',
        'it.unimi.dsi:fastutil:8.5.15',
        'io.netty:netty-buffer:4.2.2.Final',
        'io.netty:netty-transport:4.2.2.Final',
        'org.joml:joml:1.10.8',
        'org.slf4j:slf4j-api:2.0.16',
        'org.apache.commons:commons-lang3:3.17.0',
        'com.electronwill.night-config:core:3.8.1',
        'org.lwjgl:lwjgl:3.3.3',
        'org.lwjgl:lwjgl-glfw:3.3.3',
        'org.lwjgl:lwjgl-stb:3.3.3',
]

// The single library the hand-written `fml` classes name; see project(':fml') below.
// Two libraries, not one: ASM for ModFileScanData's annotationType, and DataFixerUpper
// for Stubs' throwing codecs -- both real libraries the shim runs against anyway.
// slf4j joined for com.mojang.logging.LogUtils -- the real facade over the logger
// every mod's static initializer grabs first.
// maven-artifact: IModInfo.getVersion returns its ArtifactVersion; NeoForge ships the
// same library, so answering with it is the real type rather than an invention.
ext.fmlLibraries = ['org.ow2.asm:asm:9.9', 'com.mojang:datafixerupper:8.0.16',
        'org.slf4j:slf4j-api:2.0.16', 'org.apache.maven:maven-artifact:3.9.9']

// The shim compiles against the game libraries but does not bundle them, so a JVM booted
// on shim+fml+host alone cannot load it: the first real mod dies on
// `NoClassDefFoundError: org/slf4j/LoggerFactory`. Linkage proving every mod reference
// resolves is a different claim from the shim loading on the classpath Pumpkin builds --
// this task closes that gap by materialising the libraries the shim genuinely needs.
project(':shim') {
    configurations { runtimeLibs }
    dependencies {
        rootProject.ext.gameLibraries.each { runtimeLibs it }
        rootProject.ext.fmlLibraries.each { runtimeLibs it }
    }
    tasks.register('collectRuntimeLibs', Copy) {
        group = 'shim'
        description = 'Materialises the game libraries the shim needs at runtime into libs/.'
        from configurations.runtimeLibs
        into rootProject.file('libs')
    }
}


// `fml` is what NeoForge publishes as separate artifacts and this repo hand-writes -- the
// event bus, the FML loader API, the dist marker -- plus `Unimplemented`, which everything
// throws. `shim` is the game, generated. The arrow runs shim -> fml and not the other way
// because it cannot: the decompiled sources are NeoForge's *patched* Minecraft, so
// `Block` implements `IBlockExtension` and `Item` implements `IItemExtension`.
// Generated `net.minecraft` and generated `net.neoforged` are mutually recursive and are
// one compilation unit; Gradle cannot express a cycle, so both live in `shim`. The plan
// assumed the split held and it does not -- see the task 7 report.

// The one library `fml` needs to compile. NeoForge's classpath scanner reports its
// findings in ASM's vocabulary -- `ModFileScanData.AnnotationData.annotationType()`
// returns `org.objectweb.asm.Type` -- so a hand-written class reproducing that signature
// needs ASM on the compile path. compileOnly, for the same reason as the game libraries:
// every body here throws, so nothing is needed at run time.
project(':fml') {
    dependencies {
        rootProject.ext.fmlLibraries.each { compileOnly it }
    }
}
project(':shim') {
    dependencies {
        api project(':fml')
        // Not compileOnly. A stub for a shimmed interface is a java.lang.reflect.Proxy, and
        // building one calls getMethods(), which loads every type named in every signature
        // the interface declares -- Registry names com.mojang.datafixers.util.Function7. So
        // the shim needs these on the classpath to be *used*, not merely to compile, and a
        // consumer that only compiled against it fails at the first stub.
        rootProject.ext.gameLibraries.each { implementation it }
    }
}
project(':host')    { dependencies { api project(':shim') } }
project(':testmod') { dependencies { compileOnly project(':shim') } }

project(':host') {
    test {
        dependsOn ':testmod:jar'
        systemProperty 'pumpkin.testmod.jar',
                project(':testmod').tasks.jar.archiveFile.get().asFile.absolutePath
    }
}

// The generator is one-shot scaffolding. Nothing in the shim chain may depend on it,
// and it may not depend on the shim chain: it reads and writes Java as text.
project(':generator') {
    dependencies {
        implementation 'com.github.javaparser:javaparser-core:3.28.0'
        implementation 'org.ow2.asm:asm:9.9'
    }
    tasks.register('generateShim', JavaExec) {
        group = 'shim'
        description = 'Regenerates the shim. Requires the NeoForge and mod checkouts; not run in CI.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'dev.pumpkin.shimgen.Main'
        // Every path on this task's command line -- the NeoForge and mod checkouts
        // outside the repo, and the shim/fml output roots inside it -- is written
        // relative to pumpkin-jvm-host, which is where the command is documented and
        // run from. JavaExec would otherwise resolve them against generator/.
        workingDir = rootProject.projectDir
    }

    // The game libraries the shim compiles against, resolved so the linkage check can put
    // them on the classloader it builds. A shim signature naming `Codec<ItemStack>` needs
    // `Codec` present to resolve at all, exactly as at runtime, where NeoForge supplies
    // them. They are not a `generator` dependency: the generator reads and writes Java as
    // text and must not link against the game.
    configurations { linkageLibraries }
    dependencies {
        rootProject.ext.gameLibraries.each { linkageLibraries it }
        // ASM as well: the mods call `AnnotationData.annotationType()`, whose return type
        // has to be loadable for the member to resolve at all.
        rootProject.ext.fmlLibraries.each { linkageLibraries it }
    }

    tasks.register('linkageCheck', JavaExec) {
        group = 'shim'
        description = 'Resolves every mod reference against the built shim. Needs the mod jars; not run in CI.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'dev.pumpkin.shimgen.LinkageCheck'
        dependsOn ':shim:classes', ':fml:classes'
        // Same reason as generateShim: the documented invocation writes every path
        // relative to pumpkin-jvm-host, not to generator/.
        workingDir = rootProject.projectDir
        doFirst {
            systemProperty 'pumpkin.linkage.libraries', configurations.linkageLibraries.asPath
        }
    }
}
