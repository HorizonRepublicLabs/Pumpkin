subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories { mavenCentral() }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test { useJUnitPlatform() }
}

project(':fml')     { dependencies { api project(':shim') } }
project(':host')    { dependencies { api project(':fml') } }
project(':testmod') { dependencies { compileOnly project(':fml') } }

project(':host') {
    test {
        dependsOn ':testmod:jar'
        systemProperty 'pumpkin.testmod.jar',
                project(':testmod').tasks.jar.archiveFile.get().asFile.absolutePath
    }
}

// The generator is one-shot scaffolding. Nothing in the shim chain may depend on it,
// and it may not depend on the shim chain: it reads and writes Java as text.
project(':generator') {
    dependencies {
        implementation 'com.github.javaparser:javaparser-core:3.26.4'
        implementation 'org.ow2.asm:asm:9.7'
    }
    tasks.register('generateShim', JavaExec) {
        group = 'shim'
        description = 'Regenerates the shim. Requires the NeoForge and mod checkouts; not run in CI.'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'dev.pumpkin.shimgen.Main'
    }
}
