[files]
extend-exclude = [
    "assets/",
    "crates/pumpkin-data/src/generated",
    # Generated from vanilla and NeoForge, typos included
    "java/pumpkin-jvm-host/shim/",
]

[default.extend-words]
handled = "handled"
received = "received"
ba = "ba"
fo = "fo"
undescore = "undescore"
replaceables = "replaceables"
# NeoForge mod library
registrate = "registrate"
convertable = "convertable"

[default.extend-identifiers]
# Vanilla method names
areMergable = "areMergable"
isMergable = "isMergable"
